name: Publish v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release contents
        uses: actions/checkout@v4
      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
          else
            gh release create v1.0.0 \
              --target "${GITHUB_SHA}" \
              --title "Student Task Manager v1.0.0" \
              --notes-file docs/release-notes-v1.0.0.md
          fi
